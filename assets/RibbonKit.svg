<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="RibbonKit logo">
  <defs>
    <linearGradient id="tile" x1="128" y1="96" x2="896" y2="928" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1684E8"/>
      <stop offset="0.52" stop-color="#0F6CBD"/>
      <stop offset="1" stop-color="#3746B5"/>
    </linearGradient>
    <linearGradient id="shine" x1="512" y1="64" x2="512" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
  <rect x="76" y="76" width="872" height="872" rx="196" fill="none" stroke="url(#shine)" stroke-width="24"/>

  <!-- A single folded ribbon forms an R: compact enough to remain legible at 16 px. -->
